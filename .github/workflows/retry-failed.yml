name: Retry failed runs

on:
  workflow_run:
    workflows: ["Hourly new npm packages"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.run_attempt < 4 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun "${{ github.event.workflow_run.id }}" --failed
